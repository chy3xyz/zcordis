name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zig:
    name: Zig build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is the platform this is developed on, and it is the only one that
        # exercises `loader_test`'s `.dylib` branch — on Linux that test skips.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Check formatting
        run: zig fmt --check src/ tests/ examples/ bench/ build.zig
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Benchmarks (smoke — the harness must run on every platform)
        run: zig build bench -Doptimize=fast
      - name: Fuzz (WASM interpreter, 100k iters)
        run: zig build fuzz-wasm -- 100000

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint docs
        # CODE_OF_CONDUCT.md is the Contributor Covenant verbatim, whose bare URL
        # trips MD034 — left out rather than editing upstream text.
        run: markdownlint README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md docs/*.md AGENTS.md llms.txt
