name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zig:
    name: Zig build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Fuzz (WASM interpreter, 100k iters)
        run: zig build fuzz-wasm -- 100000

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint docs
        run: markdownlint README.md docs/*.md AGENTS.md llms.txt dev.md
